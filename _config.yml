# Hero Section
name: S M Abu Naser Shovon
headline: Mechanical and Materials Engineer
description: >- # dont remove this line. this will ignore all new lines until the next section
  Mechanical Engineer (BS/MS, PhD Candidate) with 5+ years of R&D work experience on prototyping & product development, manufacturing process improvements, and experimental & analytical methods.
  Experienced in chemical processing, mechanical testing, manufacturing processes, 3D CAD modeling (SolidWorks), and additive manufacturing or 3D printing (SLA, DLP, FDM, and LPBF). Skilled in collaborating with cross-functional teams, structured problem-solving methodologies (DMAIC, FMEA, RCA), and statistical data analysis. Have strong communication and interpersonal skills, and leadership ability in technical project management.

