    tools:
    - SEM
    - UV Curing
    - FTIR
    - EDS
    - Optical Microscopy
    - 3D Optical Profilometry/Confocal Microscopy (Keyence)
    - Rheology
    - Chemical Etching
    - Thermography (IR) Analysis
  - category: Manufacturing and Machining
    tools:
    - 3D Printing (SLA, DLP, FDM and LPBF)
